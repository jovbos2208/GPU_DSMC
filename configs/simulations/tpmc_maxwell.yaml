# tpmc_maxwell: illustrative values for the configuration structure only - not a
# calibrated VLEO reference atmosphere. Schema: docs/configuration.md
simulation:
  name: tpmc_maxwell
  mode: tpmc            # tpmc | dsmc
  random_seed: 12345

geometry:
  file: ../../examples/geometry/satellite.stl   # relative to this file
  units: m

reference:
  area_m2: 1.0
  length_m: 1.0
  moment_center_m: [0.0, 0.0, 0.0]
  lift_axis_body: [0.0, 0.0, 1.0]

gas:
  number_density_m3: 1.0e14
  translational_temperature_K: 900.0
  bulk_velocity_body_mps: [-7800.0, 0.0, 0.0]
  species:            # number (mole) fractions, must sum to 1
    O: 0.80
    N: 0.15
    He: 0.05

surface:
  model: maxwell       # maxwell | cll
  temperature_K: 300.0
  maxwell:
    diffuse_fraction: 0.9

tpmc:
  particle_histories: 2000000
  max_reflections: 100

dsmc:
  collision_model: VHS
  timestep_mode: automatic
  cell_size_mode: automatic
  cell_size_pilot: false   # quick example: free-stream rule only; true (default) resolves the
                           # local mean free path (here ~9x finer cells, docs/dsmc.md 3.1)
  particles_per_cell_target: 30

statistics:
  confidence_level: 0.95
  report_uncertainty: true

output:
  directory: results/tpmc_maxwell
  format: json
  save_surface_fields: false
