# dsmc_cll: monatomic helium at a density where intermolecular collisions
# matter (lambda ~ 0.5 m, Kn ~ 0.3 based on the bus size). DSMC currently supports
# one species; mixtures follow in milestone M4. Illustrative values only - not a
# calibrated VLEO atmosphere. Schema: docs/configuration.md, method: docs/dsmc.md
simulation:
  name: dsmc_cll
  mode: dsmc            # tpmc | dsmc
  random_seed: 12345

geometry:
  file: ../../examples/geometry/satellite.stl   # relative to this file
  units: m

reference:
  area_m2: 1.0
  length_m: 1.0
  moment_center_m: [0.0, 0.0, 0.0]
  lift_axis_body: [0.0, 0.0, 1.0]

gas:
  number_density_m3: 1.0e19
  translational_temperature_K: 900.0
  bulk_velocity_body_mps: [-7800.0, 0.0, 0.0]
  species:            # DSMC: one species with VHS data (He or Ar)
    He: 1.0

surface:
  model: cll           # maxwell | cll
  temperature_K: 300.0
  cll:
    alpha_n: 0.85      # normal energy accommodation, [0, 1]
    sigma_t: 0.65      # tangential momentum accommodation, [0, 2]

tpmc:
  particle_histories: 2000000
  max_reflections: 100

dsmc:
  collision_model: VHS
  timestep_mode: automatic
  cell_size_mode: automatic
  cell_size_pilot: false   # quick example: free-stream rule only; true (default) resolves the
                           # local mean free path (here ~9x finer cells, docs/dsmc.md 3.1)
  particles_per_cell_target: 30
  sample_steps: 1000
  blocks: 20

statistics:
  confidence_level: 0.95
  report_uncertainty: true

output:
  directory: results/dsmc_cll
  format: json
  save_surface_fields: false
