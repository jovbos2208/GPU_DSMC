# tpmc_air: VLEO-like air with molecules (N2, O2: rotational and vibrational
# energy included in the heat balance). Illustrative composition only - not a
# calibrated reference atmosphere. Schema: docs/configuration.md
simulation:
  name: tpmc_air
  mode: tpmc            # tpmc | dsmc
  random_seed: 12345

geometry:
  file: ../../examples/geometry/satellite.stl   # relative to this file
  units: m

reference:
  area_m2: 1.0
  length_m: 1.0
  moment_center_m: [0.0, 0.0, 0.0]
  lift_axis_body: [0.0, 0.0, 1.0]

gas:
  number_density_m3: 1.0e14
  translational_temperature_K: 900.0
  bulk_velocity_body_mps: [-7800.0, 0.0, 0.0]
  species:            # number (mole) fractions, must sum to 1
    O: 0.60
    N2: 0.30
    O2: 0.02
    N: 0.03
    He: 0.05

surface:
  model: cll           # maxwell | cll
  temperature_K: 300.0
  cll:
    alpha_n: 0.85      # normal energy accommodation, [0, 1]
    sigma_t: 0.65      # tangential momentum accommodation, [0, 2]
    alpha_rot: 0.85    # rotational energy accommodation (default: alpha_n)
    alpha_vib: 0.85    # vibrational energy accommodation (default: alpha_n)

tpmc:
  particle_histories: 2000000
  max_reflections: 100

dsmc:
  collision_model: VHS
  timestep_mode: automatic
  cell_size_mode: automatic
  particles_per_cell_target: 30

statistics:
  confidence_level: 0.95
  report_uncertainty: true

output:
  directory: results/tpmc_air
  format: json
  save_surface_fields: false
