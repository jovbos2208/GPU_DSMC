# 70-deg blunted cone, nitrogen, Moss, Dogra & Wilmoth (NASA TM-107762) case1 (docs/verification.md),
# generated by make_cone_configs.py. rho = 1.729e-05 kg/m3, n = 3.716e+20 m^-3, V = 1502 m/s, T = 13.32 K (Ma 20.2),
# wall 300 K diffuse. VHS lambda_inf = 1.678 mm; stagnation wall ~ 23 n_inf, lambda_w ~ 0.157 mm.
# Quarter model y, z >= 0: 125 x 112 x 112 cells of 0.4 mm (dx / lambda_w = 2.6).
simulation:
  name: cone_case1_dx0p4
  mode: dsmc
  random_seed: 20261167

geometry:
  file: cone70.stl
  units: m

domain:
  box_min_m: [-0.025, 0.0, 0.0]
  box_max_m: [0.025, 0.045, 0.045]
  clip_geometry: true          # the cone crosses the symmetry planes y = 0 and z = 0

reference:
  area_m2: 0.00049087385        # quarter of pi d^2 / 4
  length_m: 0.05
  moment_center_m: [0.0, 0.0, 0.0]
  lift_axis_body: [0.0, 1.0, 0.0]  # quarter model: C_L is not meaningful

gas:
  number_density_m3: 3.71602e+20
  translational_temperature_K: 13.32
  bulk_velocity_body_mps: [1502, 0.0, 0.0]
  species:
    N2: 1.0
  collision_data:
    N2: {d_ref_m: 4.07e-10, omega: 0.75, T_ref_K: 300.0}

surface:
  model: maxwell
  temperature_K: 300
  maxwell:
    diffuse_fraction: 1.0

dsmc:
  boundary: specular            # y_min, z_min: symmetry planes
  faces:
    x_min: {type: inflow, number_density_m3: 3.71602e+20, temperature_K: 13.32, velocity_mps: [1502, 0, 0]}
    x_max: {type: inflow, number_density_m3: 3.71602e+20, temperature_K: 13.32, velocity_mps: [1502, 0, 0]}
    y_max: {type: inflow, number_density_m3: 3.71602e+20, temperature_K: 13.32, velocity_mps: [1502, 0, 0]}
    z_max: {type: inflow, number_density_m3: 3.71602e+20, temperature_K: 13.32, velocity_mps: [1502, 0, 0]}
  collision_model: VHS
  timestep_mode: fixed
  timestep_s: 6.588e-08
  cell_size_mode: fixed
  cell_size_m: 0.0004
  particles_per_cell_target: 5
  warmup_steps: 5000
  sample_steps: 5000
  blocks: 10

statistics:
  confidence_level: 0.95
  report_uncertainty: true

output:
  directory: results/cone_case1_dx0p4
  format: json
  save_surface_fields: true
