# Verification: Fourier heat conduction in argon near the continuum limit (docs/verification.md).
# Diffuse walls at y = -12 mm (323 K) and +12 mm (223 K), specular x and z,
# n = 1e21 m^-3 (lambda ~ 1.3 mm, Kn = lambda / H ~ 0.054), dx ~ lambda / 3, dt ~ 0.2 tau.
# Uniform gas at 273 K at the start; the temperature profile develops faster than
# the Couette profile (Pr = 2/3) -> 4000 warm-up steps are ample.
# Evaluate: verification/evaluate_transport.py <output dir>  (heat flux into the cold wall / core dT/dy vs.
# Chapman-Enskog). The cell state (HDF5 build) gives the profiles.
simulation:
  name: fourier_argon
  mode: dsmc
  random_seed: 20261126

geometry:
  file: marker_cube_1um.stl     # the solver needs a body: a 1 um cube in a corner
  units: m

domain:
  box_min_m: [0.0, -0.012, 0.0]
  box_max_m: [0.0008, 0.012, 0.0008]

reference:
  area_m2: 1.0
  length_m: 1.0
  moment_center_m: [0.0, 0.0, 0.0]
  lift_axis_body: [0.0, 0.0, 1.0]

gas:
  number_density_m3: 1.0e21
  translational_temperature_K: 273.0
  bulk_velocity_body_mps: [-1.0e-3, 0.0, 0.0]   # gas at rest (non-zero only for the aero axes)
  species:
    Ar: 1.0

surface:                        # marker cube only
  model: maxwell
  temperature_K: 273.0
  maxwell:
    diffuse_fraction: 0.0

dsmc:
  boundary: specular
  faces:
    y_min: {type: wall, temperature_K: 323.0}
    y_max: {type: wall, temperature_K: 223.0}   # x and z: specular
  collision_model: VHS          # or VSS
  timestep_mode: fixed
  timestep_s: 6.8e-7            # 0.2 tau
  cell_size_mode: fixed
  cell_size_m: 0.0004           # 2 x 60 x 2 cells
  particles_per_cell_target: 100
  warmup_steps: 4000
  sample_steps: 20000
  blocks: 10
  dt_DSMCState_out: 1.36e-3     # 2000 steps per file
  state_sample_every: 2

statistics:
  confidence_level: 0.95
  report_uncertainty: true

output:
  directory: results/fourier_argon
  format: json
  save_surface_fields: false
