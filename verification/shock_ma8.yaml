# Normal shock in argon at Ma 8 (docs/verification.md), generated by make_shock_configs.py.
# Upstream n1 = 1e+21 m^-3, T1 = 273 K, u1 = 2461.87 m/s; Rankine-Hugoniot downstream
# n2/n1 = 3.82090, T2/T1 = 20.87207, u2 = 644.32 m/s. lambda1 = 1.2944 mm, tau1 = 3.403e-06 s,
# tau2 = 5e-07 s. Tube [-30, 30] lambda1, cells lambda1 / 4, 5600 warm-up steps (4 flow-through
# times of the downstream gas), 28000 sampling steps, 40 cell-state files of the sampling phase.
# Evaluate: verification/shock_profile.py results/shock_ma8
simulation:
  name: shock_ma8
  mode: dsmc
  random_seed: 20261206

geometry:
  file: marker_cube_1um.stl     # the solver needs a body (1 um, specular: no influence)
  units: m

domain:
  box_min_m: [-0.0388315096, -0.01152, 2.0e-5]    # the 1 um marker cube at (4e-5, -0.0115, 4e-5) lies inside
  box_max_m: [0.0388315096, -0.0102256163, 0.00131438365]

reference:
  area_m2: 1.0
  length_m: 1.0
  moment_center_m: [0.0, 0.0, 0.0]
  lift_axis_body: [0.0, 0.0, 1.0]

gas:                            # upstream state (reference values of the run log)
  number_density_m3: 1e+21
  translational_temperature_K: 273
  bulk_velocity_body_mps: [2461.870800, 0.0, 0.0]
  species:
    Ar: 1.0

surface:
  model: maxwell
  temperature_K: 273
  maxwell:
    diffuse_fraction: 0.0

dsmc:
  boundary: specular            # y and z: specular side walls
  faces:
    x_min: {type: inflow, number_density_m3: 1e+21, temperature_K: 273, velocity_mps: [2461.870800, 0, 0], fill_depth_m: 0.0388315096}
    x_max: {type: inflow, number_density_m3: 3.8209e+21, temperature_K: 5698.075195, velocity_mps: [644.317749, 0, 0], fill_depth_m: 0.0388315096}
  collision_model: VHS
  timestep_mode: fixed
  timestep_s: 8.688e-08
  cell_size_mode: fixed
  cell_size_m: 0.000323595913
  particles_per_cell_target: 50
  warmup_steps: 5600
  sample_steps: 28000
  blocks: 10
  dt_DSMCState_out: 6.08179e-05
  state_sample_every: 2

statistics:
  confidence_level: 0.95
  report_uncertainty: true

output:
  directory: results/shock_ma8
  format: json
  save_surface_fields: false
