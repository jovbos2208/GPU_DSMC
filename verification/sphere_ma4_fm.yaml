# Free-molecular limit of the sphere series (TPMC, full sphere), generated by make_sphere_configs.py.
simulation:
  name: sphere_ma4_fm
  mode: tpmc
  random_seed: 20261127

geometry:
  file: sphere_d100mm.stl
  units: m

reference:
  area_m2: 0.0078539816       # pi R^2
  length_m: 0.1
  moment_center_m: [0.0, 0.0, 0.0]
  lift_axis_body: [0.0, 1.0, 0.0]  # quarter model: C_L is not meaningful

gas:
  number_density_m3: 1.0e16
  translational_temperature_K: 47.3684
  bulk_velocity_body_mps: [512.741, 0.0, 0.0]
  species:
    Ar: 1.0

surface:
  model: maxwell
  temperature_K: 300
  maxwell:
    diffuse_fraction: 1.0

statistics:
  confidence_level: 0.95
  report_uncertainty: true

tpmc:
  particle_histories: 20000000
  max_reflections: 100

output:
  directory: results/sphere_ma4_fm
  format: json
  save_surface_fields: false
