# Lofthouse (2008) cylinder, argon, Ma 25, Kn 0.25 (docs/verification.md), generated by
# make_cylinder_configs.py. n_inf = 1.699e+19 m^-3, T_inf = 200 K, U_inf = 6585 m/s, wall 1500 K diffuse.
# VHS lambda_inf = 70.337 mm; wall at the stagnation point ~ 125 n_inf, lambda_w ~ 0.902 mm,
# tau_w ~ 1.01e-06 s. Half model y >= 0, one cell in z: 1829 x 1219 x 1 cells of 1 mm.
# Drag per unit length = 2 F_x / dz, peak heat flux at the stagnation line: cylinder_eval.py.
simulation:
  name: cylinder_ma25_kn0p25
  mode: dsmc
  random_seed: 20261401

geometry:
  file: cylinder_12in.stl
  units: m

domain:
  box_min_m: [-0.9144, 0.0, 0.0]
  clip_geometry: true          # the cylinder crosses the symmetry plane y = 0 and the z faces
  box_max_m: [0.9144, 1.2192, 0.001]

reference:
  area_m2: 0.0003048        # D x slab thickness (C_D is the half-model value; use cylinder_eval.py)
  length_m: 0.3048
  moment_center_m: [0.0, 0.0, 0.0]
  lift_axis_body: [0.0, 1.0, 0.0]

gas:
  number_density_m3: 1.699e+19
  translational_temperature_K: 200
  bulk_velocity_body_mps: [6585, 0.0, 0.0]
  species:
    Ar: 1.0
  collision_data:
    Ar: {d_ref_m: 3.595e-10, omega: 0.734, T_ref_K: 1000.0}

surface:
  model: maxwell
  temperature_K: 1500
  maxwell:
    diffuse_fraction: 1.0

dsmc:
  boundary: specular            # y_min: symmetry plane; z faces: two-dimensional flow
  faces:
    x_min: {type: inflow, number_density_m3: 1.699e+19, temperature_K: 200, velocity_mps: [6585, 0, 0]}
    x_max: {type: inflow, number_density_m3: 1.699e+19, temperature_K: 200, velocity_mps: [6585, 0, 0]}
    y_max: {type: inflow, number_density_m3: 1.699e+19, temperature_K: 200, velocity_mps: [6585, 0, 0]}
  collision_model: VHS
  timestep_mode: fixed
  timestep_s: 1.342e-07
  cell_size_mode: fixed
  cell_size_m: 0.001
  particles_per_cell_target: 8
  warmup_steps: 11000
  sample_steps: 11000
  blocks: 10
  dt_DSMCState_out: 0.000147639
  state_sample_every: 5

statistics:
  confidence_level: 0.95
  report_uncertainty: true

output:
  directory: results/cylinder_ma25_kn0p25
  format: json
  save_surface_fields: true
