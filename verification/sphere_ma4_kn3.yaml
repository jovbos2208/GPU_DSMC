# Sphere in argon, Ma 4, Kn = lambda_inf / D = 3 (docs/verification.md), generated by
# make_sphere_configs.py. n_inf = 2.507e+18 m^-3, T_inf = 47.37 K, U_inf = 512.74 m/s, wall 300 K diffuse.
# VHS lambda_inf = 300 mm; wall at the stagnation point ~ 3.78 n_inf, lambda_w ~ 140.6 mm.
# Quarter model y, z >= 0: 110 x 80 x 80 cells of 5 mm. C_D refers to pi R^2 (area = quarter).
simulation:
  name: sphere_ma4_kn3
  mode: dsmc
  random_seed: 20261427

geometry:
  file: sphere_d100mm.stl
  units: m

domain:
  box_min_m: [-0.4, 0.0, 0.0]
  box_max_m: [0.15, 0.4, 0.4]
  clip_geometry: true          # the sphere crosses the symmetry planes y = 0 and z = 0

reference:
  area_m2: 0.0019634954       # quarter of pi R^2
  length_m: 0.1
  moment_center_m: [0.0, 0.0, 0.0]
  lift_axis_body: [0.0, 1.0, 0.0]  # quarter model: C_L is not meaningful

gas:
  number_density_m3: 2.50688e+18
  translational_temperature_K: 47.3684
  bulk_velocity_body_mps: [512.741, 0.0, 0.0]
  species:
    Ar: 1.0

surface:
  model: maxwell
  temperature_K: 300
  maxwell:
    diffuse_fraction: 1.0

statistics:
  confidence_level: 0.95
  report_uncertainty: true

dsmc:
  boundary: specular            # y_min, z_min: symmetry planes
  faces:
    x_min: {type: inflow, number_density_m3: 2.50688e+18, temperature_K: 47.3684, velocity_mps: [512.741, 0, 0]}
    x_max: {type: inflow, number_density_m3: 2.50688e+18, temperature_K: 47.3684, velocity_mps: [512.741, 0, 0]}
    y_max: {type: inflow, number_density_m3: 2.50688e+18, temperature_K: 47.3684, velocity_mps: [512.741, 0, 0]}
    z_max: {type: inflow, number_density_m3: 2.50688e+18, temperature_K: 47.3684, velocity_mps: [512.741, 0, 0]}
  collision_model: VHS
  timestep_mode: fixed
  timestep_s: 2.358e-06
  cell_size_mode: fixed
  cell_size_m: 0.005
  particles_per_cell_target: 10
  warmup_steps: 4000
  sample_steps: 4000
  blocks: 10

output:
  directory: results/sphere_ma4_kn3
  format: json
  save_surface_fields: true
