# Multi-rank check (M6.6): DSMC with an N2/O mixture (Larsen-Borgnakke
# internal energy, VSS), CLL walls and surface fields on the example satellite.
# All ranks must give identical counters and equal results up to rounding.
simulation:
  name: mpi_dsmc_air
  mode: dsmc
  random_seed: 2024
geometry:
  file: ../../examples/geometry/satellite.stl
  units: m
reference:
  area_m2: 1.0
  length_m: 1.0
  moment_center_m: [0.0, 0.0, 0.0]
  lift_axis_body: [0.0, 0.0, 1.0]
gas:
  number_density_m3: 1.0e19
  translational_temperature_K: 900.0
  bulk_velocity_body_mps: [-7700.0, 300.0, -500.0]
  species:
    N2: 0.4
    O: 0.6
surface:
  model: cll
  temperature_K: 300.0
  cll:
    alpha_n: 0.8
    sigma_t: 0.7
dsmc:
  collision_model: VSS
  timestep_mode: automatic
  cell_size_mode: automatic
  cell_size_pilot: false
  particles_per_cell_target: 20
  sample_steps: 40
  blocks: 10
output:
  format: json
  save_surface_fields: true
