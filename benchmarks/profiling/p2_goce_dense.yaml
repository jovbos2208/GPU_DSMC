# Profiling case P2: GOCE geometry in a dense transitional flow (10^4 x the 244 km density),
# so that collisions carry real load. Not a physical state (composition and temperature of
# 244 km, number density of ~97 km); at 244 km the collision kernels are nearly idle
# (GOCE 244 km run: 4e4 collisions in 2.4e11 particle steps).
# lambda_inf = 0.13 m (Kn_L ~ 0.03), 0.017 collisions per particle and step (CPU smoke test:
# collide ~9 % of the step time vs 2 % at 10^3 x). The 0.08 m cells do not resolve the local
# mean free path in the compressed gas in front of the body (irrelevant for profiling; the
# solver warns about it). Same grid, time step and particles per cell as P1: the particle
# weight is 10^4 x larger, the free-stream particle count the same, the compressed gas in
# front of the body adds more.
# 800 warm-up steps (one flow-through ~ 790 steps: the shock layer forms) + 400 sampled
# steps, a cell-state file every 200 steps.
simulation:
  name: p2_goce_dense
  mode: dsmc
  random_seed: 2442013

geometry:
  file: ../../examples/geometry/goce_march2019.stl
  units: mm

domain:
  box_min_m: [-7.5, -3.0, -3.0]
  box_max_m: [3.5, 3.0, 3.0]

reference:
  area_m2: 1.1
  length_m: 1.0
  moment_center_m: [0.0, 0.0, 0.0]
  lift_axis_body: [0.0, 0.0, 1.0]

gas:
  number_density_m3: 2.2500e19   # 10^4 x 244 km: lambda_inf = 0.13 m
  translational_temperature_K: 1016.5
  bulk_velocity_body_mps: [-7829.0, 0.0, 0.0]
  species:
    O: 0.67637
    N2: 0.29316
    N: 0.01614
    O2: 0.01134
    He: 0.00283
    Ar: 0.00016

surface:
  model: cll
  temperature_K: 300.0
  cll:
    alpha_n: 0.64
    sigma_t: 1.0

dsmc:
  collision_model: VSS
  timestep_mode: fixed
  timestep_s: 1.8e-6
  cell_size_mode: fixed
  cell_size_m: 0.08
  particles_per_cell_target: 20
  warmup_steps: 800      # one flow-through (~790 steps): the shock layer forms
  sample_steps: 400
  blocks: 10
  dt_DSMCState_out: 3.6e-4     # 200 steps per file -> 6 files

statistics:
  confidence_level: 0.95
  report_uncertainty: true

output:
  directory: results/p2_goce_dense
  format: csv
  save_surface_fields: false
